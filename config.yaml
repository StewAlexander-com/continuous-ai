# Seedling Runtime Configuration
# All tunable parameters. Edit here; seedling.py reads this at startup.

# --- Model / inference ---
# model_name is the SINGLE SOURCE OF TRUTH for the chat model. run.sh reads it
# from here, and seedling.py uses it at startup. To switch the DEFAULT model,
# change it here. To try a model for ONE run without editing this file:
#     bash run.sh --model qwen2.5:7b      (auto-pulls on Ollama; overrides chat + critic)
# Good local picks for an M1 Max (all on Ollama, all fit comfortably):
#     llama3.2        ~3B  (current; fast)
#     llama3.1:8b     ~8B  (stronger reasoning; follows guards better)
#     qwen2.5:7b      ~7B  (excellent instruction-following; low confabulation)
#     gemma2:9b       ~9B  (capable; matches python-tutor's Gemma)
#     qwen2.5:14b     ~14B (DEFAULT; strong reasoning that fits 32GB, much faster)
#     qwen3:30b-a3b   ~30B (MoE; strongest reasoning on M1 Max, but slower)
# Prefer a different model per-run without editing this file: `:model <name>` in
# a session, or `bash run.sh --model <name>` (both override chat + critic).
#
# inference_backend selects the LOCAL runtime (cloud URLs are blocked):
#   ollama        — default; uses the Ollama daemon (:11434)
#   openai_compat — any OpenAI-compatible LOCAL server (LM Studio, llama.cpp, vLLM)
# For openai_compat, load the model in your server's UI first (no auto-pull).
# Set model_name to the model id your server expects (see its /v1/models list).
inference_backend: "ollama"
# openai_compat_base_url: "http://127.0.0.1:1234/v1"   # LM Studio default
# openai_compat_base_url: "http://127.0.0.1:8080/v1"   # llama.cpp server
# openai_compat_base_url: "http://127.0.0.1:8000/v1"   # vLLM default
# openai_compat_api_key: ""                            # usually empty for local servers
model_name: "qwen3:30b-a3b"        # chat model id (Ollama tag or server model id)
# Critic local-pass model. Deliberately SMALL and separate from the chat
# model: grading a reply into a short JSON verdict doesn't need the big brain.
# Chosen by measurement, not size alone: qwen2.5:1.5b graded EVERYTHING 0.0
# and llama3.2 graded a factually wrong answer 0.80; gemma3:4b discriminates
# correctly (good ~0.9, fabricated 0.0) at ~2s/grade warm. On 32GB Apple
# Silicon, coresidency with qwen3:30b requires chat_options.num_ctx=8192,
# critic num_ctx=2048 (set in critic.py), and OLLAMA_MAX_LOADED_MODELS=2
# (set by run.sh) — otherwise every grade evicts the chat model (~6s reload).
# NOTE: `--model X` / `:model X` only retargets the critic when it was already
# tracking the chat model; a pinned separate critic stays put.
base_model: "gemma3:4b"
adapter_version: 0                  # Current LoRA adapter version (0 = base model)
# mlx_model_path: "./models/your-model-mlx"   # Tier 2: MLX-converted model dir (not GGUF)

# --- Deliberation (3-voice, variance-gated belief formation) ---
# Applies ONLY to model-derived insights (never user facts).
# thesis -> antithesis (strongest objection) -> synthesis; preserves dissent.
# Depth is adaptive (scales with disagreement) and hard-capped (MAX_ROUNDS=3).
# Set false to disable all deliberation.
#
# HONEST SCOPE (2026-06-17): the model-owned belief layer is ON and here to stay.
# The one thing NOT yet measured is whether it quantifiably improves cognition
# (no controlled A/B eval has run). Treat that as unproven, NOT disproven -- the
# mechanics work and are unit-tested; the outcome study is future work. The
# natural next step when there's time is to run that eval. See README ->
# "Status of the belief layer -- honest scope".
deliberation_enabled: true

# Live (per-turn) deliberation runs in the BACKGROUND and never blocks a reply;
# the end-of-session pass can think a little harder. Set false to deliberate
# only at session end (no per-turn background work).
live_deliberation_enabled: true

# Max seconds session end() waits for in-flight background deliberations to
# finish before giving up. A full thesis/antithesis/synthesis pass on a large
# local model (e.g. qwen3:30b with <think> blocks) can exceed 30s, so the
# default is generous; end() also scales this with the number of in-flight jobs.
# On timeout, the unfinished deliberation's cross-thread BELIEF promotion is
# deferred, but the insight itself is still captured in the session's delta
# (not lost). Lower it if you want faster exits and accept more deferrals.
deliberation_drain_timeout_s: 90

# Mid-response self-annotation (opt-in). When true, the model may tag a reasoning
# insight inline with [REMEMBER kind=... subject="..."] ... [/REMEMBER]; it is
# persisted immediately (survives an abrupt exit), gated through the doubt-scope
# guard (never stores a user-anchored fact), and stripped from the displayed
# reply. Off by default.
live_annotation_enabled: false

# --- Collaborative deliberation wall (opt-in) ---
# When deliberation genuinely STALLS (a "wall": weak candidate synthesis AND the
# two opposing positions roughly balanced, judged by the CRITIC), Aida can surface
# her lean as a QUESTION ("I'm leaning X, because Y, but Z gives me pause — do you
# agree?") and fold your answer back as a SIGNAL through the EXISTING belief
# friction. It NEVER auto-promotes and the question is always about HER reasoning
# (never an external fact), so it can't smuggle a claim past the honesty guard.
# ON, but HIGH-FIDELITY: a cheap, model-free pre-gate (wallgate.py) decides
# whether a turn is difficult enough to be worth the expensive synchronous
# deliberation, so the multi-call cost (and the interruption) is paid ONLY on
# genuinely hard turns — not on every substantive reply. Two layers:
#   * wall_gate_*  -> WHETHER to spend the deliberation (cheap difficulty gate).
#   * wall_*       -> WHETHER to actually surface the wall once deliberated
#                     (the existing conservative fuzzy assessment; unchanged).
collaborative_wall_enabled: true
wall_act_cutoff: 0.70        # act-cutoff on the defuzzified wall_score (HIGH = rare)
wall_coherence_floor: 0.30   # coherence fully 'low' at/below this
wall_coherence_ceiling: 0.65 # coherence no longer 'low' at/above this
wall_balance_margin: 0.30    # |thesis - antithesis| gap at which it's no longer 'balanced'
# --- Wall pre-gate (fidelity + cost control; see wallgate.py) ---
# Difficulty is fused (trust-weighted noisy-OR) from: caution disposition, recent
# CRITIC coherence, decision/trade-off markers in your ask, uncertainty markers in
# the reply, and correction recency. Raise the cutoff to spend deliberation (and
# thus interrupt) even more rarely; lower it to be more eager.
wall_gate_cutoff: 0.50           # difficulty needed to SPEND a deliberation (HIGH = rarer)
wall_gate_cooldown_turns: 3      # min turns between collaborative asks
wall_gate_max_per_session: 3     # hard cap on collaborative asks per session

# --- Voice / TTS (additive presentation only) ---
# Aida can SPEAK her short, safe, ephemeral replies aloud (the full reply is
# ALWAYS printed and is the record; speech never changes what she says or the
# floor that decides whether to speak). Fully local, no network.
#   tts_engine: "kokoro" -> preferred neural voice (kokoro-onnx, in-process, no
#               server); falls back to macOS `say` automatically if unavailable.
#   tts_engine: "say"    -> use the built-in macOS `say` directly.
# tts_voice is the engine-appropriate voice id (a Kokoro voice like "af_kore",
# or a `say` voice when engine=say). On a kokoro->say fallback the env var
# AIDA_VOICE_NAME (or the system default) is used for `say`.
# The Kokoro model files are looked up at these paths (repo dir by default).
tts_engine: "kokoro"
tts_voice: "af_kore"
kokoro_model_path: "kokoro-v1.0.onnx"
kokoro_voices_path: "voices-v1.0.bin"

# --- Speak-bias (honest "speak the speakable" disposition) ---
# ONE flag drives BOTH layers so belief == behavior:
#   1) MECHANISM: widens ONLY the style gate in voicelayer.route() — never the
#      floor. Short replies still speak in full (zero regression); for a longer
#      reply, the floor-clean LEAD sentence(s) may be spoken. What's spoken is
#      ALWAYS a verbatim substring of the printed reply, re-checked against the
#      floor and the length cap; otherwise she stays silent.
#   2) SELF-MODEL: injects a stated, inspectable principle into the system prompt
#      (only while this is on) so Aida can truthfully articulate the disposition.
# OFF by default would be the safe choice; the user's spec sets it ON.
speak_bias: true
speak_lead_sentences: 1        # N lead sentences spoken on the long-reply path

# --- Osmotic learning (usage-utility; "signal is ease of use") ---
# Learning by osmosis: beliefs that measurably SERVE the conversation (their
# content surfaces in coherent replies while injected) earn a tiny salience
# boost at session end; beliefs injected while the user had to CORRECT take a
# tiny decay. All evidence is gathered deterministically (lexical counters, no
# model calls, no reply-path cost) and applied ONCE at end(). Non-regressive:
# salience stays clamped in [0,1], lifetime osmotic gain is hard-capped
# (osmosis_boost_cap) so use can polish a belief but never crown it, and
# nothing is ever deleted -- only the existing prune can quarantine (revivable).
# Set osmosis_enabled false to keep the counters (measurement) but apply nothing.
osmosis_enabled: true
osmosis_boost: 0.01          # salience gain per used-belief session (x uses, max 3)
osmosis_decay: 0.02          # salience loss per correction-adjacent session (max 3)
osmosis_boost_cap: 0.15      # LIFETIME cap on osmotic salience gain per belief
# Per-session cap on NEW beliefs entering via osmotic channels ([REMEMBER],
# reflection, document insights). Deliberated syntheses are exempt (earned
# through friction). Scarcity upstream of the belief cap prevents good
# incumbents being churned through quarantine by a chatty session.
osmosis_promotion_budget: 2

# --- Reflection (sleep pass) ---
# Offline review of Aida's own sediment, run via ':reflect' (never on the
# reply path): resolves latent contradictions between active beliefs, paroles
# archived beliefs whose subject RECURRED in recent gated deltas (external
# evidence required -- reflection cannot ruminate a belief back on its own),
# and mines sub-gate insights that converged across >= 3 distinct threads.
# Model spend is hard-capped per pass; a safety snapshot precedes any change;
# revivals/promotions consume the osmotic promotion budget above; nothing is
# ever deleted. reflection_on_session_end additionally runs one pass at every
# session end -- OFF by default until you've watched a few ':reflect' reports.
reflection_enabled: true
reflection_max_deliberations: 1
reflection_on_session_end: false

# --- Document osmosis ---
# Beliefs formed while a user-attached file (:read) is in the model window
# carry 'document:<hash>' provenance: auditable back to the file, retractable
# in ONE sweep (':forget-doc <file>' -> archived, revivable, never deleted),
# CONTESTED-BY-CONSTRUCTION (a default "single unverified document" dissent
# until independently re-earned), and counted against the osmotic promotion
# budget. Persona (user-owned truth) is structurally untouched. Set false to
# restore the pre-osmosis behavior exactly (plain deliberation provenance).
document_osmosis_enabled: true

# --- Caution disposition controller ---
# Forward-acting assertion restraint from lagged CRITIC signals (never sync critic
# on the reply path). Fuzzy control law only; guards and gauge writes untouched.
# Set false to disable. Tunables mirror caution.py; see docs/design/caution-disposition.md.
caution_controller_enabled: true
caution_integral_half_life: 3.0
caution_wall_session_cap: 0.65

# --- Thin Chain-of-Verification (CoVe) ---
# Second-pass honesty rewrite ONLY when caution applied_d >= cov_min_applied_d
# (default 0.68 = DECLINE_FIRST). Draft is buffered (not streamed) on those rare
# turns so the user never sees an unverified invention. Side call only — never
# writes MCM / persona / gauges. Fail-safe keeps the original draft. Set false
# to disable. Complements :read citation framing (prompt-only; no extra call).
chain_of_verification_enabled: true
cov_min_applied_d: 0.68

# --- Responsiveness ---
# Ollama generation options for the CHAT model. ALL OPTIONAL -- anything left
# unset uses the model's own default (so this block is a no-op until you tune it).
#   num_predict : cap reply length in tokens (stops runaway generations)
#   num_ctx     : context window size (must fit system prompt + history window)
#   temperature / top_p / top_k : sampling controls
#   num_thread  : CPU threads (Apple Silicon usually best left unset)
# Cap context so the chat model (~19GB at 8k) AND the small critic (~4GB at
# 2k) can stay coresident on a 32GB Mac. Ollama otherwise auto-picks 32k on
# Metal (25GB "VRAM"), which forces unload/reload thrash (~6s) every time the
# critic grades. Pair with OLLAMA_MAX_LOADED_MODELS=2 (set by run.sh).
chat_options: { num_ctx: 8192 }
#   example:  chat_options: { num_predict: 512, num_ctx: 8192 }

# How many recent transcript turns to RE-SEND to the model each turn. The full
# transcript is always persisted (RDST is unaffected); this only bounds the
# re-fed context so per-turn latency stays flat as the conversation grows.
# ~12 user+assistant exchanges. Raise for longer working memory, lower for speed.
history_window_turns: 24

# --- File attachments (:read / :more) ---
# Largest local text/python/CSV/PDF/DOCX file the ':read' command will OPEN, in MB. This
# is the acceptance limit, NOT how much is shown to the model: large files are
# paged through with ':more' in context-sized chunks (a whole large file cannot
# fit a context window). For bigger chunks per page, raise num_ctx in
# chat_options above (costs RAM + a little latency). Default: 50 MB.
max_attach_mb: 50

# PDF extraction (:read on .pdf). PyMuPDF extracts embedded text; sparse/scanned
# pages optionally use Tesseract OCR when installed (brew install tesseract;
# pip install pytesseract pillow). OCR never invents text — pages it can't read
# are marked image-only. Disable OCR to speed up reads of born-digital PDFs only.
pdf_reader_enabled: true
pdf_max_pages: 500                  # cap pages extracted per PDF (honest truncation)
pdf_min_chars_per_page: 25          # below this, try OCR then mark image-only
pdf_min_extractable_ratio: 0.02     # refuse if almost no pages yield text
pdf_ocr_enabled: true
pdf_ocr_dpi_scale: 2.0              # render scale for OCR (higher = slower, sharper)

# DOCX extraction (:read on .docx). python-docx extracts paragraphs + tables.
# Legacy .doc (Word 97–2003) is not supported — save as .docx or PDF first.
# Images/charts/layout are omitted with an explicit notice (never invented).
docx_reader_enabled: true
docx_max_paragraphs: 20000          # cap paragraphs extracted (honest truncation)
docx_max_tables: 500                # cap tables extracted

# --- Corpus search / security scan (opt-in; reversible) ---
# ripgrep-all (`rga`) is a SYSTEM binary, never vendored. AGPL; subprocess only.
# Empty allowlist denies all search/scan even if a flag is later turned on.
# Suggestion never enables a flag — edit this file yourself.
# In chat: :search <what>  (Aida interprets English, searches, then reviews)
#          optional: "quoted"  name <pat>  <what> /file.txt  in <dir> depth 1|3|all
#          :scan / :scan <path>  (never sent to the model)
rga_search_enabled: true
rga_search_allowed_paths:
  - /Users/stewartalexander/seedling
  - /Users/stewartalexander/Desktop
rga_search_max_hits: 50
rga_search_timeout_s: 20
rga_search_max_filesize: "4M"
security_scan_enabled: false        # read-only; no git history, no auto-fix
# Let the model know the COUNTS and KINDS a :scan found (never paths and
# never matched text). Off by default: with it off, the only thing the model
# learns is that a scan ran and that its output was not shared — not even
# whether anything was found — so "nothing is sent to the model" stays
# literally true. Turn it on if you want Aida to help triage without you
# pasting the lines yourself.
scan_summary_to_model: false

# :read path disambiguation — when a path fails, offer real nearby filenames
# (fuzzy match in the directory you named). Reply  y / 1  or a number to attach;
# never auto-reads without your confirmation. Set false to restore plain errors.
read_suggest_enabled: true
read_suggest_max: 12                 # max numbered choices shown
read_suggest_min_score: 0.55         # fuzzy stem-match floor (0–1; higher = stricter)

# --- Background scheduling (foreground-priority) ---
# Critic grades and live-deliberation rounds run on background THREADS, but
# there is ONE local GPU: without a gate their model calls sit in front of the
# user's next turn in the inference queue. With the gate, every background
# model call first yields to any active foreground turn (checked between
# deliberation ROUNDS, not just jobs), waits at most background_max_deferral_s
# (starvation escape -- low priority never becomes no priority), and generates
# at most background_num_predict tokens (so the one un-preemptable in-flight
# call stays short). Nothing is dropped: gated jobs wait; end() still drains.
# Every model call is timing-logged (logs/seedling.log '[timing] role=...'
# + 'model_call' events) so you can SEE where each turn's seconds went.
background_gate_enabled: true
background_max_deferral_s: 120
# Token cap per background call. Sized by measurement on qwen3:30b-a3b with
# think=False: the model still leaks ~250-400 tokens of narration (ending in a
# bare </think>) before the actual verdict, so 512 reliably fits narration +
# answer (~5-6s worst-case in front of a user turn); 256 truncated before the
# answer arrived. The transport strips the narration; a round truncated before
# its answer FAILS SAFE (deliberation passthrough), never stores fragments.
background_num_predict: 512

# --- Critic ---
critic_backend: "local"             # "local" (no API key, first-run safe) or "perplexity"
perplexity_model: "sonar"           # sonar | sonar-pro (sonar-pro = stronger but slower)
# PERPLEXITY_API_KEY must be set as environment variable (not stored here)

# --- RDST (Regressive Dynamic Self-Tuning) ---
tuning_threshold_n: 10              # Number of threads before tuning suggestion
recency_decay_factor: 0.05          # λ for exp(-λ * age): higher = stronger recency bias
correction_penalty: 0.15            # Score deduction per user correction
critic_weight: 0.8                  # Weight of critic score in composite signal
top_n_training: 10                  # Top N threads selected for training data

# --- Logging ---
# Controls the FILE log (logs/seedling.log), which keeps the full trail for
# deep dives. The CHAT view stays quiet by default (warnings/errors only) so the
# conversation reads cleanly. Set DEBUG (or env LOG_CONSOLE=1) to also show INFO
# on screen while debugging.
log_level: "INFO"                   # DEBUG | INFO | WARNING | ERROR
snapshot_on_exit: true              # Write snapshot on every graceful_pause()
log_rotation_days: 30               # TODO: rotate logs older than N days

# --- Evaluation thresholds (eval.py run_eval_report) ---
eval_thresholds:
  min_coherence: 0.60               # Below this → tuning warranted
  max_correction_rate: 0.30         # Above this → tuning warranted
  max_drift_risk: 0.50              # Above this → consider rollback first
  min_adapter_stability: 0.60       # Below this → adapter variance too high
  # Training sufficiency warnings (:tune preview) — informational only, never block
  warn_training_exchanges_below: 20  # LoRA on fewer exchanges rarely generalizes
  warn_training_threads_below: 5     # Diversity: threads with transcripts in the training set
  warn_attachment_fraction_above: 0.50   # File-attach turns dominating the JSONL
  warn_single_thread_fraction_above: 0.60  # One session supplies most exchanges
  warn_transcript_skips_above: 3     # Scored threads missing logs/transcript_<id>.jsonl
