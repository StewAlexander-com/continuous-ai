name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Smoke tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          # ollama/httpx are not needed for these offline tests; install the
          # storage + config stack the tests actually exercise.
          pip install "lancedb>=0.6.0" "pyarrow>=15.0.0" "pyyaml>=6.0"

      - name: Byte-compile all modules
        run: python -m compileall -q *.py

      - name: Schemas smoke test (instantiate + serialize)
        run: python schemas.py

      - name: Storage + evaluation + failure-mode suite
        run: |
          python eval.py
