<text x="46" y="168" fill="#c7b9bd" font-family="Arial, Helvetica, sans-serif" font-size="18" >Material you choose to share</text>
<text x="363" y="124" fill="#f6efea" font-family="Georgia, Times New Roman, serif" font-size="27" >Aida + local model</text>
<text x="363" y="168" fill="#c7b9bd" font-family="Arial, Helvetica, sans-serif" font-size="18" >Conversation and review</text>
<text x="713" y="124" fill="#f6efea" font-family="Georgia, Times New Roman, serif" font-size="27" >Saved context</text>
<text x="713" y="168" fill="#c7b9bd" font-family="Arial, Helvetica, sans-serif" font-size="18" >Available next session</text>
