<text x="32" y="118" fill="#f6efea" font-family="Georgia, Times New Roman, serif" font-size="60" >A conversation</text>
<text x="32" y="183" fill="#f6efea" font-family="Georgia, Times New Roman, serif" font-size="60" >you can build on.</text>
