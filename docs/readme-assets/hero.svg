<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
<title id="title">A conversation you can build on.</title><desc id="desc">Aida is a local AI assistant with memory you can inspect and correct. Abstract connecting lines illustrate continuity, not model internals or a real conversation.</desc>
