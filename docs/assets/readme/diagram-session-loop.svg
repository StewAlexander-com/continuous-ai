<svg xmlns="http://www.w3.org/2000/svg" width="740" height="330" viewBox="0 0 740 330" role="img" aria-labelledby="t">
<title id="t">Session control loop</title>
<rect width="740" height="330" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#E07A2F"/></marker></defs>
<text x="40" y="34" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#24292F">Session control loop</text>
<text x="40" y="56" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#57606A">Epistemics as control flow - failures only reduce, never fabricate.</text>
<rect x="40" y="85" width="140" height="70" rx="8" fill="#FFF4EB" stroke="#E07A2F" stroke-width="1.5"/>
<text x="110.0" y="113" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#24292F">1. Restore</text>
<text x="110.0" y="133" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#57606A">MCM → prompt</text>
<rect x="210" y="85" width="140" height="70" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="280.0" y="113" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#24292F">2. Chat</text>
<text x="280.0" y="133" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#57606A">Local LLM stream</text>
<rect x="380" y="85" width="140" height="70" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="450.0" y="113" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#24292F">3. Critique</text>
<text x="450.0" y="133" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#57606A">Background critic</text>
<rect x="550" y="85" width="140" height="70" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="620.0" y="113" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#24292F">4. Write Δ</text>
<text x="620.0" y="133" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#57606A">LanceDB + snapshot</text>
<rect x="210" y="200" width="140" height="70" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="280.0" y="228" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#24292F">5. L3 fold</text>
<text x="280.0" y="248" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#57606A">consolidation.py</text>
<rect x="380" y="200" width="140" height="70" rx="8" fill="#EEF6EE" stroke="#1A7F37" stroke-width="1.5"/>
<text x="450.0" y="228" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#24292F">6. Caution</text>
<text x="450.0" y="248" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#57606A">Downward-only</text>
<rect x="550" y="200" width="140" height="70" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="620.0" y="228" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#24292F">7. RDST*</text>
<text x="620.0" y="248" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#57606A">LoRA if approved</text>
<line x1="180" y1="120" x2="210" y2="120" stroke="#E07A2F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="350" y1="120" x2="380" y2="120" stroke="#E07A2F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="520" y1="120" x2="550" y2="120" stroke="#E07A2F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="620" y1="155" x2="620" y2="200" stroke="#E07A2F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="550" y1="235" x2="350" y2="235" stroke="#E07A2F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="280" y1="200" x2="280" y2="155" stroke="#E07A2F" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M450 200 V172 H280" fill="none" stroke="#1A7F37" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="365" y="168" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#1A7F37">next-turn restraint</text>
<text x="40" y="310" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#57606A">* RDST only after N threads + explicit approval · Apple Silicon / MLX</text>
</svg>
