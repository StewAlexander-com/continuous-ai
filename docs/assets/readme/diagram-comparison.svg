<svg xmlns="http://www.w3.org/2000/svg" width="800" height="365" viewBox="0 0 800 365" role="img" aria-labelledby="t">
<title id="t">Mainstream memory vs Continuous-AI at a glance</title>
<rect width="800" height="365" fill="#FFFFFF"/>
<text x="40" y="34" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#24292F">Mainstream memory vs Continuous-AI</text>
<rect x="220" y="55" width="260" height="36" rx="6" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="350" y="78" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#57606A">Mainstream</text>
