<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" role="img" aria-labelledby="t">
<title id="t">Two paths into memory: user facts vs earned beliefs</title>
<rect width="820" height="330" fill="#FFFFFF"/>
<text x="40" y="34" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#24292F">How something becomes durable memory</text>
<text x="40" y="56" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#57606A">User-anchored facts skip deliberation. Model insights must survive an objection.</text>
<rect x="40" y="80" width="340" height="220" rx="8" fill="#FFF4EB" stroke="#E07A2F" stroke-width="1.5"/>
<text x="210" y="108" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#E07A2F">USER PATH - persona layer</text>
<rect x="70" y="128" width="280" height="36" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="210" y="151" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#24292F">"Remember..." / "That's wrong - ..."</text>
<text x="210" y="185" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#E07A2F">↓</text>
<rect x="70" y="198" width="280" height="36" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="210" y="221" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#24292F">Deterministic promote / prune</text>
<text x="210" y="255" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#E07A2F">↓</text>
<rect x="70" y="268" width="280" height="20" rx="4" fill="#E07A2F"/>
<text x="210" y="282" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Always-injected · verbatim · auditable</text>
<rect x="420" y="80" width="360" height="220" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="600" y="108" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#24292F">MODEL PATH - belief layer</text>
<rect x="450" y="128" width="300" height="28" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="600" y="147" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#24292F">Thesis (model insight)</text>
<text x="600" y="172" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#57606A">↓</text>
<rect x="450" y="180" width="300" height="28" rx="6" fill="#FFFFFF" stroke="#CF222E" stroke-width="1.5"/>
<text x="600" y="199" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#24292F">Antithesis (structured objection)</text>
<text x="600" y="224" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#57606A">↓</text>
<rect x="450" y="232" width="300" height="28" rx="6" fill="#FFFFFF" stroke="#1A7F37" stroke-width="1.5"/>
<text x="600" y="251" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#24292F">Synthesis - only survivors persist</text>
<text x="600" y="285" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#57606A">Consensus = low-information · dissent kept</text>
</svg>
